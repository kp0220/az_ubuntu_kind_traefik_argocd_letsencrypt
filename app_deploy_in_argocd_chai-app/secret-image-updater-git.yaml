# Kubernetes Secret resource for Argo CD Image Updater git write-back credentials
apiVersion: v1  # API version for a Kubernetes Secret object
kind: Secret  # Resource type used to store credentials securely
metadata:  # Metadata for the secret
  name: argocd-image-updater-git-creds  # Secret name used by Image Updater
  namespace: argocd  # Namespace where Argo CD is installed
  labels:  # Labels to help identify the secret
    app.kubernetes.io/name: argocd-image-updater  # Application name label
    app.kubernetes.io/component: git-write-back  # Component label for git write-back
stringData:  # Plain-text values that Kubernetes will store as secret data
  username: "kp0220"  # Git username used to access the Git repository
  password: "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" # GitHub PAT or password with repo write permission
type: Opaque # Standard secret type for arbitrary key/value data
